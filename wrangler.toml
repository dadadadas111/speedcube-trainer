# One Worker serves both halves: the built app as static assets, and /sync.
#
# This is deliberately NOT a Pages project. Pages routes a functions/ directory
# by filename; a Worker with static assets is one script that routes for itself
# and ignores functions/ entirely. The project was deployed as a Worker, so
# this is the shape that matches it.
name = "speedcube-trainer"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# The app is a single-page app: unknown paths must return index.html rather
# than 404, or a refresh on any view breaks.
not_found_handling = "single-page-application"
# Without this the asset server answers first and /sync never reaches the
# Worker, which is exactly how the endpoints came back as HTML.
run_worker_first = ["/sync", "/sync/*"]

# The sync store. Create it once with:
#   npx wrangler d1 create cube-sync
# then paste the id it prints here, and apply the schema with:
#   npx wrangler d1 migrations apply cube-sync --remote
[[d1_databases]]
binding = "DB"
database_name = "cube-sync"
database_id = "054d3d61-7a30-4689-a843-6174d369923d"

# SYNC_USER and SYNC_PASSWORD are secrets, not variables:
#   npx wrangler secret put SYNC_USER
#   npx wrangler secret put SYNC_PASSWORD
# They are read at request time inside the Worker and never reach the browser,
# which is the whole difference between this and a VITE_ build variable.
