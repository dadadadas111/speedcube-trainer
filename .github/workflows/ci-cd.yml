name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kiểm tra và build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Chạy test lõi (engine khối, nhận dạng bước Roux, drill)
        run: npm test

      - name: Build
        run: npm run build

      - name: Lưu bản build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy lên cube.dash.id.vn
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cube.dash.id.vn
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Chuẩn bị SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Đường mạng từ runner của GitHub tới VPS thỉnh thoảng rớt gói, biểu hiện
      # là "connection timed out". Không phải lỗi phía app, nên chỉ cần thử lại
      # thay vì để cả lần deploy hỏng. ConnectTimeout ngắn để hỏng thì hỏng nhanh.
      - name: Đẩy bản build lên server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "--- lần thử $attempt ---"
            rsync -az --delete --checksum \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3" \
              dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
            code=$?
            [ $code -eq 0 ] && echo "đẩy xong ở lần thử $attempt" && exit 0
            echo "lần thử $attempt hỏng (mã $code), chờ rồi thử lại"
            sleep $((attempt * 10))
          done
          echo "Đã thử 4 lần vẫn không nối được tới server."
          exit 1

      - name: Kiểm tra site còn sống
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' https://cube.dash.id.vn/ || echo 000)
            echo "lần $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Site không trả về 200 — kiểm tra nginx trên server."
          exit 1
