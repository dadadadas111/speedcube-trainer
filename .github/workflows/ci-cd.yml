name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests (cube engine, Roux step detection, drill)
        run: npm test

      # The relay and the sync store are installed by hand on the VPS (see
      # server/README.md), so CI is the only thing keeping them honest.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Relay tests
        run: |
          python -m venv server/venv
          server/venv/bin/pip -q install websockets
          server/venv/bin/python server/__relaytest.py

      - name: Build
        run: npm run build

      # Kept for looking at what a commit produced. The deploy itself is
      # Cloudflare Pages building from this repository, not an upload from here.
      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
