# api.cube.dash.id.vn — the two things that need a machine.
#
# The app itself is static and lives on Cloudflare Pages now, which is why this
# block serves no files at all. That split is deliberate: when this box dies,
# the site stays up and only the phone bridge, the sync store and the OBS
# overlay go with it.
#
# It also makes the app cross-origin to its own API, and that is not free. The
# sync client sends an Authorization header, which is not a CORS-safelisted
# header, so every call is preceded by an OPTIONS preflight. Without the
# headers below the browser blocks the request before sync.py ever sees it, and
# what the user gets is a generic network error rather than anything true.
#
# certbot --nginx -d api.cube.dash.id.vn writes the TLS lines.

server {
    server_name api.cube.dash.id.vn;

    # Nothing is served from disk here
    location / { return 404; }

    location /sync {
        # `always`, because a 401 from a wrong password is exactly the response
        # that most needs to reach the app, and add_header skips error
        # responses without it. Missing that turns "wrong password" into "CORS
        # error", which sends you debugging the wrong thing.
        add_header Access-Control-Allow-Origin  https://cube.dash.id.vn always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Max-Age       86400 always;

        # Answer the preflight here; it never needs to reach Python
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Websockets carry no preflight, so the relay needs no CORS headers. What it
    # does need is a read timeout long enough for a quiet room: the default 60s
    # would drop a bridge that is merely waiting for the next turn.
    location /relay {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 80;
}
